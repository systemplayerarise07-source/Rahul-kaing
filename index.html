<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Master: Quest Board</title>
    <style>
        :root { --neon-blue: #00d4ff; --dark-bg: #0a0f1d; --card-bg: #16213e; --text-color: #e0e0e0; }
        body { background: var(--dark-bg); color: var(--text-color); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        header { text-align: center; padding: 20px; border-bottom: 2px solid var(--neon-blue); margin-bottom: 25px; }
        h1 { color: var(--neon-blue); text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 0 15px var(--neon-blue); font-size: 22px; }
        .quest-container { max-width: 600px; margin: auto; }
        .quest-card { background: var(--card-bg); border: 1px solid #2a3a5a; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.4); position: relative; }
        .level-badge { position: absolute; top: -10px; left: 15px; background: var(--neon-blue); color: #000; font-weight: bold; padding: 2px 12px; border-radius: 20px; font-size: 12px; }
        .mission-title { font-size: 18px; color: #f472b6; margin-bottom: 10px; font-weight: bold; }
        textarea { width: 100%; height: 80px; background: #000; color: #00ff41; border: 1px solid #444; border-radius: 8px; padding: 10px; font-family: 'Courier New', monospace; box-sizing: border-box; margin-top: 10px; }
        .btn-lock { background: var(--neon-blue); color: #000; border: none; padding: 12px; border-radius: 6px; width: 100%; font-weight: bold; text-transform: uppercase; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-lock:hover { opacity: 0.8; box-shadow: 0 0 10px var(--neon-blue); }
        .saved-msg { color: #4ade80; font-size: 12px; text-align: center; margin-top: 8px; display: none; }
    </style>
</head>
<body>

<header>
    <h1>⚔️ SOVEREIGN MASTER ⚔️</h1>
    <p style="font-size: 12px; opacity: 0.7;">Lifetime Progress Tracking System</p>
</header>

<div class="quest-container" id="questList">
    </div>

<script>
    const totalDays = 31;
    const container = document.getElementById('questList');

    // Display Quests
    for (let i = 1; i <= totalDays; i++) {
        const savedText = localStorage.getItem('master_quest_day_' + i) || "";
        
        container.innerHTML += `
            <div class="quest-card">
                <div class="level-badge">LVL ${i}</div>
                <div class="mission-title">Mission: Training Phase ${i}</div>
                <p style="font-size: 14px; margin: 0; opacity: 0.8;">PDF ke mutabiq apni rai aur progress niche record karein:</p>
                <textarea id="task-${i}" placeholder="Systems Online... Enter data.">${savedText}</textarea>
                <button class="btn-lock" onclick="saveData(${i})">Lock Progress</button>
                <div id="msg-${i}" class="saved-msg" style="${savedText ? 'display:block' : ''}">✅ LEVEL ${i} DATA SYNCED</div>
            </div>
        `;
    }

    function saveData(day) {
        const content = document.getElementById('task-' + day).value;
        localStorage.setItem('master_quest_day_' + day, content);
        document.getElementById('msg-' + day).style.display = 'block';
        alert("System Update: Level " + day + " progress has been locked!");
    }
</script>

</body>
</html>
